<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Messages</title>
<style>body{font:16px/1.6 system-ui,sans-serif;max-width:720px;margin:2rem auto;padding:0 1rem}input,button{font:inherit;padding:.5rem .8rem}.m{border:1px solid #ccd;border-radius:8px;padding:1rem;margin:1rem 0}small{color:#667}</style></head>
<body><h1>Inbox</h1><p><input id="k" type="password" placeholder="Admin key"> <button id="go">Load messages</button></p><p id="e" role="status"></p><div id="l"></div>
<script>
document.getElementById('go').onclick=async()=>{const e=document.getElementById('e'),l=document.getElementById('l');l.textContent='';e.textContent='';
const r=await fetch('/api/messages',{headers:{'x-admin-key':document.getElementById('k').value}});
if(!r.ok){e.textContent='Wrong key or ADMIN_KEY not set on the server.';return}
const a=await r.json();e.textContent=a.length+' message(s)';
a.forEach(x=>{const d=document.createElement('div');d.className='m';const h=document.createElement('b');h.textContent=x.name+' ';const s=document.createElement('small');s.textContent=x.email+' · '+new Date(x.at).toLocaleString();const p=document.createElement('p');p.textContent=x.message;d.append(h,s,p);l.append(d)})};
</script></body></html>
